[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "courtiq"
version = "0.1.0"
description = "CourtIQ: Pressure-Aware Shot Quality and Decision Audit (Phase 1)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<2.3.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "scipy>=1.11.0,<1.15.0",
    "matplotlib>=3.8.0,<3.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.4.0",
]

[project.scripts]
courtiq = "courtiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
